name: Build and Release PDF (LuaLaTeX)

on:
  push:
    tags:
      - 'ver-*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Fetch all tags
      run: git fetch --tags --force

    # Generate gitinfo.tex here, where git is available. latexmk also runs
    # gitinfo.sh (see .latexmkrc), but inside the action's container git may
    # be unusable, in which case gitinfo.sh keeps this file.
    - name: Generate gitinfo.tex for colophon
      run: ./gitinfo.sh

    - name: Compile LaTeX with LuaLaTeX
      uses: dante-ev/latex-action@2026-C
      with:
        root_file: simetrije.tex

    - name: Create GitHub Release and upload PDF
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: simetrije.pdf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
